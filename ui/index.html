<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FusionServe</title>
    <script>
      // Apply the persisted theme before first paint to avoid a
      // flash-of-wrong-theme. Mirrors the logic in ``src/lib/theme.ts``;
      // keep the two in sync (storage key ``theme``, values
      // ``light`` | ``dark`` | ``system``/absent).
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage unavailable (e.g. private mode): fall back to CSS. */
        }
      })();
    </script>
  </head>
  <body class="h-full bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
