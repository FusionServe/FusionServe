# Build-script approvals for transitive dependencies. pnpm 11 refuses to run
# a dependency's install scripts unless it is listed here, and errors
# (ERR_PNPM_IGNORED_BUILDS) if any ignored build is left unacknowledged.
#
#   - esbuild / @parcel/watcher  Angular build + dev-server toolchain; their
#                                postinstall scripts are allowed to run.
#   - lmdb / msgpackr-extract    native accelerators (pulled transitively via
#                                the Stoplight/Altair viewers) that ship pure-JS
#                                fallbacks, so their native builds are skipped.
#   - @scarf/scarf               install-time analytics — opted out (see also
#                                scarfSettings in package.json).
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  less: false
  lmdb: false
  msgpackr-extract: false
  nx: false
